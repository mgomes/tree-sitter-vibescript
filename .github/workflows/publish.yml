name: Publish Rust crate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.70.0)
        required: true

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          crate = tomllib.loads(Path("Cargo.toml").read_text())
          version = crate["package"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          assert json.loads(Path("package.json").read_text())["version"] == version
          assert json.loads(Path("tree-sitter.json").read_text())["metadata"]["version"] == version
          PY
      - run: cargo test --locked
      - run: cargo publish --dry-run --locked
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
